<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - Authorized Access Only</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1f2937 0%, #111827 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .lock-icon {
            font-size: 40px;
            margin-bottom: 10px;
            display: inline-block;
        }

        .login-header h2 {
            color: #111827;
            font-size: 26px;
            margin-bottom: 6px;
        }

        .login-header p {
            color: #6b7280;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-group input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 10px;
        }

        .btn-login:hover {
            background-color: #4338ca;
        }

        .error-banner {
            background-color: #fee2e2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            margin-bottom: 20px;
            font-weight: 500;
            display: none;
            border: 1px solid #fca5a5;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-header">
            <div class="lock-icon">🔒</div>
            <h2>Admin Control Panel</h2>
            <p>Sign in to manage student records</p>
        </div>

        <div class="error-banner" id="errorBanner">
            Invalid Username or Password.
        </div>

        <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
            <div class="form-group">
                <label for="adminName">Admin Username</label>
                <input type="text" id="adminName" placeholder="Enter username" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="adminPassword">Password</label>
                <input type="password" id="adminPassword" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-login">Secure Login</button>
        </form>
    </div>

    <script>
        async function handleAdminLogin(event) {
            event.preventDefault();

            const nameInput = document.getElementById('adminName').value.trim();
            const passwordInput = document.getElementById('adminPassword').value;
            const errorBanner = document.getElementById('errorBanner');

            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username: nameInput, password: passwordInput })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    errorBanner.style.display = "none";
                    alert("Authentication successful! Redirecting to panel...");
                    window.location.href = "/admin"; 
                } else {
                    errorBanner.textContent = data.message || "Invalid Username or Password.";
                    errorBanner.style.display = "block";
                    document.getElementById('adminPassword').value = '';
                }
            } catch (err) {
                errorBanner.textContent = "Error connecting to server. Please try again.";
                errorBanner.style.display = "block";
                document.getElementById('adminPassword').value = '';
            }
        }
    </script>

</body>
</html>
